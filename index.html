function renderTopics(filteredTopics) {
    const grid = document.getElementById('topicsGrid');
    grid.innerHTML = '';
    filteredTopics.sort((a, b) => {
        const statusOrder = { 'must': 0, 'pending': 1, 'not-suit': 2 };
        if (statusOrder[a.status] !== statusOrder[b.status]) return statusOrder[a.status] - statusOrder[b.status];
        return b.total_score - a.total_score;
    });
    filteredTopics.forEach(t => {
        const card = document.createElement('div');
        card.className = `topic-card ${t.status === 'must' ? 'must' : t.status === 'pending' ? 'pending' : 'not-suit'}`;
        card.onclick = () => card.classList.toggle('expanded');
        const statusLabel = t.status === 'must' ? '必写' : t.status === 'pending' ? '待定' : '不适合';
        const statusBadge = t.status === 'must' ? 'badge-must' : t.status === 'pending' ? 'badge-pending' : 'badge-not';
        let scoreHTML = '';
        for (const [dim, score] of Object.entries(t.scores)) {
            const cls = score >= 8 ? 'high' : score >= 5 ? 'mid' : 'low';
            scoreHTML += `<div class="score-item"><span>${dim}</span><div class="score-bar-bg"><div class="score-bar ${cls}" style="width:${score*10}%"></div></div><span>${score}</span></div>`;
        }
        const totalClass = t.total_score >= 8 ? 'high' : t.total_score >= 6 ? 'mid' : 'low';
        let rulesHTML = t.rules.map(r => `
            <div class="rule-item ${r.pass ? 'rule-pass' : 'rule-fail'}">
                <span class="icon">${r.pass ? '✓' : '✗'}</span>
                <strong>${r.name}</strong>
                <span class="dim">${r.detail}</span>
            </div>
        `).join('');
        card.innerHTML = `
            <div class="topic-header">
                <div class="topic-title">${t.title}</div>
                <div style="display:flex; align-items:center; gap:10px; flex-shrink:0;">
                    <div class="total-score ${totalClass}">${t.total_score.toFixed(1)}</div>
                </div>
            </div>
            <div class="topic-badges">
                <span class="badge ${statusBadge}">${statusLabel}</span>
                <span class="badge badge-cat">${t.category}</span>
                <span class="badge" style="background:rgba(255,255,255,0.05);color:var(--text-secondary);border:1px solid var(--card-border)">${t.timing}</span>
                ${t.hot ? '<span class="badge badge-hot">🔥 高热度</span>' : ''}
            </div>
            <div class="score-row">${scoreHTML}</div>
            <div class="topic-detail">
                <div class="three-rules">${rulesHTML}</div>
                <div class="reason-box"><strong>推荐理由：</strong>${t.reason}</div>
                <div class="source-tag">📊 数据来源：${t.source}</div>
            </div>
        `;
        grid.appendChild(card);
    });
}
function updateStats(filtered) {
    document.getElementById('totalCount').textContent = filtered.length;
    document.getElementById('mustCount').textContent = filtered.filter(t => t.status === 'must').length;
    document.getElementById('pendingCount').textContent = filtered.filter(t => t.status === 'pending').length;
    document.getElementById('notCount').textContent = filtered.filter(t => t.status === 'not-suit').length;
}
function renderPriority() {
    const mustTopics = topics.filter(t => t.status === 'must').sort((a, b) => b.total_score - a.total_score);
    const pendingTopics = topics.filter(t => t.status === 'pending').sort((a, b) => b.total_score - a.total_score);
    const notTopics = topics.filter(t => t.status === 'not-suit').sort((a, b) => b.total_score - a.total_score);
    const list = document.getElementById('priorityList');
    let html = '';
    html += '<h3 style="color:var(--must-write);margin:12px 0 8px;font-size:16px;">第一梯队：立刻写</h3>';
    mustTopics.forEach((t, i) => {
        html += `<li class="priority-item p1"><span class="priority-rank" style="color:var(--must-write)">${i+1}</span><div><div>${t.title}</div><div class="priority-reason">${t.category} · ${t.total_score.toFixed(1)}分 · ${t.timing}</div></div></li>`;
    });
    html += '<h3 style="color:var(--pending);margin:20px 0 8px;font-size:16px;">第二梯队：本周内准备</h3>';
    pendingTopics.filter(t => t.total_score >= 6.0).forEach((t, i) => {
        html += `<li class="priority-item p2"><span class="priority-rank" style="color:var(--pending)">${i+1}</span><div><div>${t.title}</div><div class="priority-reason">${t.category} · ${t.total_score.toFixed(1)}分 · ${t.timing}</div></div></li>`;
    });
    html += '<h3 style="color:var(--not-suit);margin:20px 0 8px;font-size:16px;">建议暂不追</h3>';
    notTopics.forEach((t, i) => {
        html += `<li class="priority-item p3"><span class="priority-rank" style="color:var(--not-suit)">${i+1}</span><div><div>${t.title}</div><div class="priority-reason">${t.category} · ${t.total_score.toFixed(1)}分 · ${t.reason.slice(0, 40)}...</div></div></li>`;
    });
    list.innerHTML = html;
}
let currentStatus = 'all';
let currentCat = 'all';
function applyFilters() {
    let filtered = topics;
    if (currentStatus !== 'all') filtered = filtered.filter(t => t.status === currentStatus);
    if (currentCat !== 'all') filtered = filtered.filter(t => t.category === currentCat);
    renderTopics(filtered);
    updateStats(filtered);
}
function filterByStatus(status, btn) {
    currentStatus = status;
    document.querySelectorAll('.filter-bar > .filter-btn').forEach(b => { b.className = 'filter-btn'; });
    if (status === 'must') btn.classList.add('active-must');
    else if (status === 'pending') btn.classList.add('active-pending');
    else if (status === 'not-suit') btn.classList.add('active-not');
    else btn.classList.add('active');
    applyFilters();
}
function filterByCat(cat, btn) {
    currentCat = cat;
    document.querySelectorAll('.cat-filters .filter-btn').forEach(b => { b.className = 'filter-btn'; });
    if (cat !== 'all') btn.classList.add('active-cat');
    else btn.classList.add('active');
    applyFilters();
}
renderPriority();
applyFilters();
